<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UFC Legends | Erro 404 - Combate Não Encontrado</title>
    <style>
        :root {
            --bg-color: #0b0b0c;
            --card-bg: #141517;
            --primary-color: #d20a0a;
            --text-color: #ffffff;
            --text-muted: #9a9a9a;
            --accent-gold: #ffb700;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 450px;
            width: 100%;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid #25262b;
        }

        .header-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, var(--primary-color), #8a0606);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 20px rgba(210, 10, 10, 0.4);
        }

        .header-icon svg {
            width: 40px;
            height: 40px;
            fill: var(--text-color);
        }

        .error-code {
            font-size: 72px;
            font-weight: 900;
            color: var(--primary-color);
            line-height: 1;
            margin-bottom: 5px;
            letter-spacing: -2px;
        }

        h3 {
            font-size: 22px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
            color: var(--text-color);
        }

        p {
            color: var(--text-muted);
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .fighter-preview {
            width: 100%;
            height: 150px;
            border-radius: 10px;
            margin-bottom: 25px;
            background-size: cover;
            background-position: center;
            border: 1px solid #2d2f34;
            /* Mantida a textura original do octógono */
            background-image: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MCIgaGVpZ2h0PSI0MCIgdmlld0JveD0iMCAwIDQwIDQwIj48cGF0aCBkPSJNMjAgMEw0MCAxMEw0MCAzMEwyMCA0MEwwIDMwTDAgMTBaIiBmaWxsPSIjMWMxZDIyIiBzdHJva2U9IiMyNTI2MmIiIHN0cm9rZS13aWR0aD0iMSIvPjwvc3ZnPg==");
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .badge {
            background: rgba(0, 0, 0, 0.75);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-gold);
            border: 1px solid var(--accent-gold);
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .btn-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            background-color: var(--primary-color);
            color: var(--text-color);
            text-decoration: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 14px;
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
        }

        .btn-link:hover {
            background-color: #ff1212;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(210, 10, 10, 0.3);
        }

        .btn-link svg {
            width: 18px;
            height: 18px;
            fill: var(--text-color);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Ícone Temático de Alerta / Octógono com Interrogação -->
        <div class="header-icon">
            <svg viewBox="0 0 24 24">
                <path d="M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M11,18V16H13V18H11M11,6H13V14H11V6Z" />
            </svg>
        </div>

        <div class="error-code">404</div>
        <h3>Combate não encontrado</h3>
        <p>O round acabou e essa página não resistiu ao nocaute. O conteúdo que você procura mudou de categoria ou nunca subiu no octógono.</p>

        <!-- Elemento visual temático adaptado -->
        <div class="fighter-preview">
            <span class="badge">
                ⚠️ Interrupção Médica
            </span>
        </div>

        <!-- Link de retorno para a Home -->
        <a href="/" class="btn-link">
            <svg viewBox="0 0 24 24" style="transform: rotate(180deg);">
                <path d="M4,11V13H16L10.5,18.5L11.92,19.92L19.84,12L11.92,4.08L10.5,5.5L16,11H4Z" />
            </svg>
            <span>Voltar para a Inicial</span>
        </a>
    </div>
</body>
</html>
